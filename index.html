<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Lyrics Finder</h1>
    <p>Search public-domain songs and read their lyrics.</p>
  </header>

  <main class="container">
    <form id="search-form" class="search-bar">
      <label for="search-input" class="sr-only">Search by song title or artist</label>
      <input
        id="search-input"
        type="text"
        placeholder="Search by song title or artist..."
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <section class="content-grid">
      <div class="panel">
        <h2>Results</h2>
        <ul id="results-list" class="results-list">
          <li class="muted">Type a song title or artist to search.</li>
        </ul>
      </div>

      <article class="panel">
        <h2 id="lyrics-title">Lyrics</h2>
        <p id="lyrics-artist" class="muted"></p>
        <pre id="lyrics-body" class="lyrics-body">Select a song from the results to view its lyrics.</pre>
      </article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
